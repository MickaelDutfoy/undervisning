    <text x="253" y="279">-1</text><text x="253" y="307">-2</text><text x="253" y="336">-3</text><text x="253" y="364">-4</text><text x="253" y="393">-5</text><text x="253" y="421">-6</text><text x="253" y="449">-7</text>
